name: Build OpenWrt for Lite-On WP8722-BT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' \
            azure-cli google-cloud-cli google-chrome-stable firefox \
            powershell mono-devel 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          echo "=== After cleanup ==="
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            python3-dev libelf-dev ecj fastjar java-propose-classpath \
            libncurses-dev python3-distutils qemu-utils

      - name: Clone OpenWrt source (tidurberdiri fork with WP8722-BT support)
        run: |
          git clone --depth=1 https://github.com/tidurberdiri/openwrt.git openwrt
          cd openwrt
          git fetch --depth=50 origin 37ba182675570e80409bac42b60e4ce0e115a3bc
          git checkout 37ba182675570e80409bac42b60e4ce0e115a3bc
          echo "=== Commit info ==="
          git log --oneline -1
          echo "=== Files changed in this commit ==="
          git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "(shallow clone, cannot diff)"

      - name: Verify DTS file exists
        run: |
          echo "=== Checking WP8722-BT DTS ==="
          ls -la openwrt/target/linux/ath79/dts/qca9563_liteon_wp8722-bt.dts
          echo "=== Checking image profile ==="
          grep -n "wp8722" openwrt/target/linux/ath79/image/generic.mk || echo "WARNING: No image profile found in generic.mk"
          echo "=== Checking base-files ==="
          grep -rn "wp8722" openwrt/target/linux/ath79/base-files/ || echo "WARNING: No base-files entries found"

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build target
        run: |
          cd openwrt
          cat > .config << 'ENDCONFIG'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_liteon_wp8722-bt=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-nls-cp437=y
          CONFIG_PACKAGE_kmod-nls-iso8859-1=y
          CONFIG_PACKAGE_block-mount=y
          ENDCONFIG
          make defconfig
          echo "=== Target device check ==="
          grep "wp8722\|WP8722\|liteon" .config || echo "Device not found in config!"
          echo "=== Final .config summary ==="
          grep "^CONFIG_TARGET" .config | head -20

      - name: Download source packages
        run: |
          cd openwrt
          make download -j$(nproc) V=s || make download -j1 V=s

      - name: Build toolchain and firmware
        run: |
          cd openwrt
          echo "=== Starting build at $(date) ==="
          echo "=== CPU info ==="
          nproc
          make -j$(nproc) V=s 2>&1 | tee build.log | grep -E '^\[|^make\[|error|warning' | tail -200
          BUILD_EXIT=$?
          echo "=== Build finished at $(date) with exit code $BUILD_EXIT ==="
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== Parallel build failed, retrying with -j1 ==="
            make -j1 V=s 2>&1 | tail -300
          fi

      - name: List output files
        if: always()
        run: |
          echo "=== Firmware output ==="
          find openwrt/bin/targets/ -type f -name "*wp8722*" -o -name "*liteon*" 2>/dev/null | head -20
          echo "=== All target files ==="
          ls -lhR openwrt/bin/targets/ath79/generic/ 2>/dev/null | head -50
          echo "=== Disk usage ==="
          df -h /

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-liteon-wp8722-bt-firmware
          path: |
            openwrt/bin/targets/ath79/generic/*wp8722*
            openwrt/bin/targets/ath79/generic/*liteon*
            openwrt/bin/targets/ath79/generic/sha256sums
          if-no-files-found: warn

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
